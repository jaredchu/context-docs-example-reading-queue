name: Test and deploy
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir .local/build
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_D1_DATABASE_ID != ''
    needs: test
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: reading-queue-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate deployment URL
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: node -e "if (!process.env.DEMO_URL || new URL(process.env.DEMO_URL).protocol !== 'https:') throw new Error('Set the HTTPS DEMO_URL repository variable before deployment')"
      - run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify deployed revision
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: node scripts/verify-deployment.mjs
